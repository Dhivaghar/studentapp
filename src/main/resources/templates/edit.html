<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h2>Edit Student</h2>

    <div class="card">

        <form action="/students/update" method="post">

            <input type="hidden" name="id" th:value="${student.id}">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" th:value="${student.name}" placeholder="Enter student name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" th:value="${student.email}" placeholder="Enter student email" required>
            </div>

            <div class="form-actions">
                <a href="/students" class="btn btn-back">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Student</button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
